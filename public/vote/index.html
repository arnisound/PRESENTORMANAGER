<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<title>Participer</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<style>
  :root { --accent: #c48626; --on-accent: #111; color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; color: #0f172a; }
  header { background: #0a0a0b; color: #fff; padding: 12px 20px; font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 12px; }
  header img { width: 36px; height: 36px; }
  footer { text-align: center; color: #94a3b8; font-size: 12px; padding: 0 0 24px; }
  footer b { color: #c48626; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgba(15,23,42,.08); display: flex; flex-direction: column; gap: 12px; }
  h2 { margin: 0; font-size: 20px; line-height: 1.3; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; cursor: pointer; background: #fff; text-align: left; width: 100%; color: inherit; font-family: inherit; }
  .opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, #fff); }
  .opt input { accent-color: var(--accent); width: 18px; height: 18px; }
  .stars { display: flex; justify-content: space-between; gap: 6px; }
  .stars button { flex: 1; font-size: 30px; padding: 10px 0; border: 2px solid #e2e8f0; border-radius: 10px; background: #fff; color: #cbd5e1; cursor: pointer; }
  .stars button.on { color: #f59e0b; border-color: #f59e0b; }
  input[type=text], textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; }
  textarea { min-height: 90px; resize: vertical; }
  .send { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .send:disabled { opacity: .5; }
  .ok { color: #15803d; font-weight: 600; }
  .muted { color: #64748b; }
  .res { display: grid; grid-template-columns: 1fr 50px; gap: 4px 10px; font-size: 14px; align-items: center; }
  .res i { display: block; height: 8px; border-radius: 4px; background: var(--accent); margin-top: 3px; }
</style>
</head>
<body>
<header><img src="/brand/logo-192.png" alt=""><span id="title">Participer</span></header>
<main>
  <section class="card" id="poll"><p class="muted">Aucun vote en cours. Cette page se met à jour toute seule.</p></section>
  <section class="card" id="qa" hidden>
    <h2>Poser une question</h2>
    <textarea id="q-text" maxlength="280" placeholder="Votre question…"></textarea>
    <input type="text" id="q-author" maxlength="40" placeholder="Votre nom (facultatif)">
    <button class="send" id="q-send">Envoyer</button>
    <div id="q-ok" class="ok" hidden>Merci, votre question a été transmise.</div>
  </section>
</main>
<footer>Propulsé par <b>PresenThor</b> · <a href="https://arnisoundtools.com" target="_blank" rel="noopener" style="color:inherit">arnisoundtools.com</a></footer>
<script type="module">
import { Client, esc } from '/shared/client.js';
const $ = (s) => document.getElementById(s);
// Identifiant anonyme et stable : un vote par appareil (modifiable).
let voter;
try { voter = localStorage.getItem('presenthor.voter') || crypto.randomUUID(); localStorage.setItem('presenthor.voter', voter); } catch { voter = Math.random().toString(36).slice(2); }
const mine = (id) => { try { return JSON.parse(localStorage.getItem('presenthor.vote.' + id)); } catch { return null; } };
const keep = (id, v) => { try { localStorage.setItem('presenthor.vote.' + id, JSON.stringify(v)); } catch {} };
let pollId = null, draft = null, last = null;
const client = new Client({ role: 'audience', onPublic: (s) => { last = s; render(s); } });

function render(s) {
  const acc = s.accent || '#c48626';
  document.documentElement.style.setProperty('--accent', acc);
  // Texte noir ou blanc selon la clarté de la couleur du show (lisibilité des boutons).
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(acc.slice(i, i + 2), 16) / 255);
  document.documentElement.style.setProperty('--on-accent', 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.45 ? '#111' : '#fff');
  $('title').textContent = s.show?.name || 'Participer';
  document.title = s.show?.name || 'Participer';
  $('qa').hidden = !s.qaOpen;
  const p = s.poll;
  if (!p) { pollId = null; $('poll').innerHTML = '<p class="muted">Aucun vote en cours. Cette page se met à jour toute seule.</p>'; return; }
  const voted = mine(p.id);
  if (p.id !== pollId) { pollId = p.id; draft = voted ?? (p.kind === 'multi' ? [] : null); }
  let h = `<h2>${esc(p.question)}</h2>`;
  if (p.kind === 'choice' || p.kind === 'multi') {
    h += p.options.map((o, i) => {
      const on = p.kind === 'multi' ? draft?.includes(i) : draft === i;
      return `<button class="opt${on ? ' sel' : ''}" data-i="${i}"><input type="${p.kind === 'multi' ? 'checkbox' : 'radio'}" tabindex="-1" ${on ? 'checked' : ''}>${esc(o)}</button>`;
    }).join('');
  } else if (p.kind === 'rating') {
    h += `<div class="stars">${[1, 2, 3, 4, 5].map((n) => `<button data-star="${n}" class="${draft >= n ? 'on' : ''}">★</button>`).join('')}</div>`;
  } else {
    h += `<input type="text" id="word" maxlength="30" placeholder="Un mot ou une expression" value="${esc(draft || '')}">`;
  }
  h += `<button class="send" id="send">${voted != null ? 'Modifier mon vote' : 'Voter'}</button>`;
  if (voted != null) h += '<div class="ok">Vote enregistré ✓</div>';
  if (p.results && voted != null && p.kind !== 'words') {
    const labels = p.kind === 'rating' ? ['1★', '2★', '3★', '4★', '5★'] : p.options;
    h += `<div class="res">${labels.map((l, i) => { const pc = p.results.total ? Math.round((p.results.counts[i] / p.results.total) * 100) : 0; return `<div>${esc(l)}<i style="width:${pc}%"></i></div><div>${pc} %</div>`; }).join('')}</div>`;
  }
  const word = document.activeElement?.id === 'word';
  if (!word) $('poll').innerHTML = h;
}

$('poll').addEventListener('click', async (e) => {
  const opt = e.target.closest('[data-i]'), star = e.target.closest('[data-star]');
  if (opt) {
    const i = +opt.dataset.i;
    if (Array.isArray(draft)) draft = draft.includes(i) ? draft.filter((x) => x !== i) : [...draft, i];
    else draft = i;
  }
  if (star) draft = +star.dataset.star;
  if (e.target.id === 'send') {
    if (document.getElementById('word')) draft = document.getElementById('word').value.trim();
    if (draft == null || draft === '' || (Array.isArray(draft) && !draft.length)) return;
    const r = await client.send({ type: 'vote', pollId, voterId: voter, answer: draft });
    if (r?.ok) keep(pollId, draft); else alert(r?.error || 'Erreur');
  }
  if (last) render(last);
});

$('q-send').onclick = async () => {
  const text = $('q-text').value.trim();
  if (!text) return;
  $('q-send').disabled = true;
  const r = await client.send({ type: 'qa.ask', text, author: $('q-author').value.trim() });
  $('q-send').disabled = false;
  if (r?.ok) { $('q-text').value = ''; $('q-ok').hidden = false; setTimeout(() => ($('q-ok').hidden = true), 4000); }
  else alert(r?.error || 'Erreur');
};
</script>
</body>
</html>
