<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Régie — PresenThor</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/shared/stage.css">
<link rel="stylesheet" href="/control/control.css">
</head>
<body>
<header class="top">
  <div class="brand"><img class="brand-logo" src="/brand/logo-192.png" alt=""><span class="brand-txt"><span class="brand-name">PresenThor</span><a class="brand-by" href="https://arnisoundtools.com" target="_blank" rel="noopener">by arnisoundtools.com</a></span><span class="brand-sep"></span>
    <input id="show-name" class="show-name" spellcheck="false" aria-label="Nom de l'événement"></div>
  <span class="conn" id="conn">●</span>
  <span class="clients" id="clients"></span>
  <div class="spacer"></div>
  <div class="deck" id="deck" hidden>
    <button class="btn sm" data-act="deck-prev" title="Diapo précédente (← / PageUp / télécommande)">◀</button>
    <span id="deck-label"></span>
    <button class="btn sm" data-act="deck-next" title="Diapo suivante (→ / PageDown / télécommande)">▶</button>
  </div>
  <label class="master" title="Opacité générale de la composition">Master <input type="range" id="master" min="0" max="1" step="0.01"></label>
  <span class="master sound" title="Son général de toutes les sorties (double-clic : 0 dB)"><button class="btn sm" id="mute" title="Couper / rétablir tout le son">🔊</button><input type="range" id="master-db" min="-60" max="12" step="0.5"><output id="master-db-val">0 dB</output></span>
  <button class="btn" id="clear-all" title="Vider tous les calques">Tout vider</button>
  <button class="btn danger" id="blackout" title="Écran noir (B)">NOIR</button>
  <div class="timer-box">
    <span id="timer-display" class="timer-display" title="Cliquer pour régler le chrono">00:00</span>
    <button id="timer-toggle" class="btn sm" title="Démarrer / pause">▶</button>
    <button id="timer-reset" class="btn sm" title="Remettre à zéro">↺</button>
  </div>
  <div class="clock" id="clock"></div>
  <button class="btn" id="prefs-btn" title="Préférences">⚙ Préférences</button>
</header>

<main class="layout">
  <!-- Grille calques × colonnes -->
  <section class="grid-area">
    <div class="grid" id="grid"></div>
    <div class="grid-tools">
      <span class="hint">Vignettes</span><input type="range" id="cell-zoom" min="90" max="420" step="2" title="Taille des vignettes">
      <button class="btn sm" id="cell-fit" title="Vignettes à la taille de la fenêtre (toutes les colonnes visibles)">Ajuster</button>
      <button class="btn sm" id="grid-max" title="Agrandir la grille (double-clic sur la barre de séparation)">⤢ Agrandir</button>
    </div>
  </section>
  <div class="split" id="split" title="Glisser pour agrandir la grille ou le bas · double-clic : agrandir / rétablir"></div>

  <!-- Bas : moniteurs, propriétés, navigateur -->
  <section class="bottom">
    <div class="monitors">
      <div class="mon-view" id="mon-view"><button data-mv="both" title="Sortie et aperçu">PGM + Aperçu</button><button data-mv="pgm">PGM</button><button data-mv="pvw">Aperçu</button></div>
      <div class="mon mon-pgm">
        <div class="mon-tag"><span>SORTIE</span><span id="out-info"></span></div>
        <div class="mon-box"><div id="out-mon" class="mon-stage pgm"></div></div>
      </div>
      <div class="mon mon-pvw">
        <div class="mon-tag"><span>APERÇU</span><span id="pvw-info"></span></div>
        <div class="mon-box"><div id="pvw-mon" class="mon-stage pvw"></div></div>
      </div>
      <div class="transport" id="transport"></div>
    </div>

    <div class="panel props">
      <nav class="tabs" id="prop-tabs">
        <button data-ptab="comp">Composition</button>
        <button data-ptab="layer">Calque</button>
        <button data-ptab="clip" class="active">Clip</button>
      </nav>
      <div class="tab-body" id="props"></div>
    </div>

    <div class="panel browser">
      <nav class="tabs" id="br-tabs">
        <button data-btab="media" class="active">Médias</button>
        <button data-btab="sources">Sources</button>
        <button data-btab="fx">Effets</button>
        <button data-btab="outputs">Sorties</button>
        <button data-btab="public">Public</button>
        <button data-btab="live">Direct</button>
        <button data-btab="settings">Infos</button>
        <button class="popout" id="popout" data-act="popout">↗</button>
        <button class="popout panel-only" data-act="panel-fullscreen" title="Plein écran">⛶</button>
      </nav>
      <div class="tab-body" id="browser"></div>
    </div>
  </section>
</main>
<div id="menu" class="menu" hidden></div>
<div id="drop" class="drop" hidden>Déposez sur une case de la grille, ou ici pour la bibliothèque</div>
<input type="file" id="file-input" multiple hidden accept=".pdf,.pptx,.ppt,.pps,.ppsx,.odp,.key,.mp4,.webm,.mov,.m4v,.mkv,.png,.jpg,.jpeg,.gif,.webp,.svg,.mp3,.wav,.ogg,.m4a,.aac">
<div id="toast" class="toast" hidden></div>
<script type="module" src="/control/control.js"></script>
</body>
</html>
